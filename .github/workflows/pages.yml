name: Verify and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run calculation and contract tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.test.js; do
            node "$test_file"
            count=$((count + 1))
          done
          echo "Passed ${count} test files"
      - name: Check production JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script_file in \
            app.js \
            engineering-number-format.js \
            monopole-app.js \
            reo-calculation.js \
            rock-anchor-selector/app.js; do
            node --check "$script_file"
          done
      - name: Check repository diff integrity
        run: git diff --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4
