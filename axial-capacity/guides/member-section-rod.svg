<title id="title">Round bar section guide</title><desc id="desc">Solid round bar with diameter d. Symbolic guide, not to scale; geometry values come from the selected section record.</desc>
<defs><style>
 .outline{fill:#f4f6f7;stroke:#263640;stroke-width:1.35;stroke-linejoin:round}
