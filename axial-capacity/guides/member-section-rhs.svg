<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128" role="img" aria-labelledby="title desc">
<title id="title">RHS section guide</title><desc id="desc">Rectangular hollow section with depth d, width b and wall thickness t. Symbolic guide, not to scale; geometry values come from the selected section record.</desc>
<defs><style>
 .outline{fill:#f4f6f7;stroke:#263640;stroke-width:1.35;stroke-linejoin:round}
 .void{fill:white;stroke:#263640;stroke-width:1.35}
 .dim{fill:none;stroke:#4c5963;stroke-width:.8}
 .extension{fill:none;stroke:#70808b;stroke-width:.65}
 .axis{fill:none;stroke:#657581;stroke-width:.75;stroke-dasharray:6 2 1 2}
 .arrow{fill:#4c5963;stroke:none}
 text{fill:#263640;font:400 12px Arial,Helvetica,sans-serif;font-style:italic}
 tspan{font-size:8.5px;font-style:normal}
</style><marker id="leader" viewBox="0 0 4 2" refX="4" refY="1" markerWidth="3.2" markerHeight="1.6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L4 1 L0 2 Z" fill="#4c5963"/></marker></defs>
