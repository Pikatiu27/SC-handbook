<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128" role="img" aria-labelledby="title desc">
<title id="title">UC section guide</title><desc id="desc">I section with d, bf, tw, tf and centroidal x-y axes. Symbolic guide, not to scale; geometry values come from the selected section record.</desc>
<defs><style>
